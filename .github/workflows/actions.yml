name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install node dependencies
      run: |
        cd frontend
        npm ci

    - name: Frontend typecheck and build
      run: |
        cd frontend
        npm run build

    - name: Shared unit tests
      run: cargo test --locked -p shared

    - name: Server pure unit tests
      run: cargo test --locked -p azookey-server --lib

    - name: UI theme unit tests
      run: cargo test --locked -p ui

    - name: Client pure unit tests
      run: cargo test --locked -p azookey-windows --lib

    - name: Launcher unit tests
      run: cargo test --locked -p launcher

    - name: Validate startup task template
      shell: pwsh
      run: |
        [xml]$task = Get-Content "installer/Azookey Startup.xml" -Raw -Encoding UTF8
        $ns = New-Object System.Xml.XmlNamespaceManager($task.NameTable)
        $ns.AddNamespace("task", "http://schemas.microsoft.com/windows/2004/02/mit/task")
        $exec = $task.SelectSingleNode("//task:Actions/task:Exec", $ns)
        if ($null -eq $exec) { throw "Exec action is missing" }
        if ($exec.Command -ne "PATH_TO_LAUNCHER") { throw "Unexpected task command" }
        if ($exec.WorkingDirectory -ne "PATH_TO_APP") { throw "Unexpected task working directory" }
        if ($null -ne $exec.Arguments) { throw "Legacy script arguments are still present" }
        # Pipes are per user and session, so every logon needs its own
        # launcher; IgnoreNew would skip a second user's logon.
        $policy = $task.SelectSingleNode("//task:Settings/task:MultipleInstancesPolicy", $ns)
        if ($policy.InnerText -ne "Parallel") { throw "Startup task must start one instance per logon" }
        # Every interactive user (BUILTIN\Users) needs a server and UI, not
        # only administrators; admins still get their full token.
        $principal = $task.SelectSingleNode("//task:Principals/task:Principal", $ns)
        if ($principal.GroupId -ne "S-1-5-32-545") { throw "Startup task must run for every user (BUILTIN\Users)" }
        if ($principal.RunLevel -ne "HighestAvailable") { throw "Startup task must use the highest available run level" }
        # The launcher supervises the server and UI for the whole session;
        # stopping the task on battery would kill it on unplug.
        $settings = $task.SelectSingleNode("//task:Settings", $ns)
        if ($settings.StopIfGoingOnBatteries -ne "false") { throw "Startup task must not stop on battery power" }
        if ($settings.DisallowStartIfOnBatteries -ne "false") { throw "Startup task must start on battery power" }

        $installer = Get-Content "installer/Installer.iss" -Raw
        if ($installer -match "CreateVbsFile|PATH_TO_VBS|wscript\.exe") {
          throw "Legacy VBS startup path is still referenced by the installer"
        }

        # The elevated uninstaller must not run anything found through HKCU,
        # which non-elevated processes can change.
        if ($installer -match "RegQueryStringValue\(HKCU") {
          throw "The installer reads a value from HKCU"
        }

        # The settings app is installed per machine, like the IME.
        $tauri = Get-Content "frontend/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
        if ($tauri.bundle.windows.nsis.installMode -ne "perMachine") {
          throw "The settings app must be installed per machine"
        }

        # WebView2 is installed by the outer installer from a verified copy in
        # Program Files, not by the settings app's NSIS installer, which
        # would run a bootstrapper from a fixed path in the user's TEMP.
        if ($tauri.bundle.windows.webviewInstallMode.type -ne "skip") {
          throw "The settings app installer must not install WebView2"
        }
        if ($installer -notmatch "Dependency_AddWebView2;") {
          throw "The installer does not install WebView2"
        }

        $nsis = Get-Content "frontend/src-tauri/installer.nsi" -Raw
        if ($nsis -notmatch 'schtasks\.exe" /Delete /TN "Azookey Startup" /F') {
          throw "Tauri uninstaller does not clean the startup task"
        }

    - name: Rust workspace check
      run: cargo check --locked --workspace --all-targets

  build:
    needs: validate
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Install Swift
      uses: compnerd/gha-setup-swift@main
      with:
        swift-version: swift-6.3.3-release
        swift-build: 6.3.3-RELEASE

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install cargo-make
      run: cargo install cargo-make --locked

    - name: Download prebuilt llama
      run: |
        function Download-Extract {
          param (
            [string]$url,
            [string]$destFolder
          )
          $tempZip = Join-Path $env:TEMP "llama_temp.zip"
          Invoke-WebRequest -Uri $url -OutFile $tempZip
          New-Item -Path $destFolder -ItemType Directory -Force
          Expand-Archive -Path $tempZip -DestinationPath $destFolder -Force
          Remove-Item $tempZip
        }

        $llamaCpuDir = "llama_cpu"
        $llamaCudaDir = "llama_cuda"
        $llamaVulkanDir = "llama_vulkan"
        New-Item -Path $llamaCpuDir, $llamaCudaDir, $llamaVulkanDir -ItemType Directory -Force

        Download-Extract -url "https://github.com/fkunn1326/llama.cpp/releases/download/b4846/llama-b4846-bin-win-avx-x64.zip" -destFolder $llamaCpuDir
        Download-Extract -url "https://github.com/fkunn1326/llama.cpp/releases/download/b4846/llama-b4846-bin-win-cuda-cu12.4-x64.zip" -destFolder $llamaCudaDir
        Download-Extract -url "https://github.com/fkunn1326/llama.cpp/releases/download/b4846/llama-b4846-bin-win-vulkan-x64.zip" -destFolder $llamaVulkanDir

        Copy-Item "$llamaCpuDir\llama.lib" -Destination "server-swift\" -Force
        (Resolve-Path $llamaCpuDir).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        $zenzUrl = "https://huggingface.co/Miwa-Keita/zenz-v3-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf"
        $zenzDest = "zenz.gguf"
        Invoke-WebRequest -Uri $zenzUrl -OutFile $zenzDest

    - name: Install node dependencies
      run: |
        cd frontend
        npm ci

    - name: Swift unit tests
      run: swift test --package-path server-swift

    - name: Verify Cargo lockfile
      run: cargo metadata --locked --no-deps > $null

    - name: Build
      run: cargo make build --release

    - name: Verify the Swift resource bundles are packaged
      shell: pwsh
      run: |
        # EfficientNGram loads its tokenizer from this bundle next to
        # azookey-server.exe; without it, enabling personalization crashes
        # the server.
        $tokenizer = "build/AzooKeyKanakanjiConverter_EfficientNGram.resources/tokenizer/tokenizer.json"
        if (-not (Test-Path $tokenizer)) { throw "$tokenizer is missing" }

    - name: Verify launcher has no console subsystem
      shell: pwsh
      run: |
        $path = "build/launcher.exe"
        $bytes = [System.IO.File]::ReadAllBytes($path)
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
        $optionalHeader = $peOffset + 24
        $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
        if ($subsystem -ne 2) {
          throw "launcher.exe must use IMAGE_SUBSYSTEM_WINDOWS_GUI (2), got $subsystem"
        }

    - name: End-to-end smoke test from a read-only install directory
      shell: pwsh
      timeout-minutes: 20
      run: |
        # Like Program Files for the IME's processes: nothing may be written
        # next to the binaries (e.g. WebView2 user data).
        $dir = "C:\AzookeySmoke"
        Copy-Item -Recurse build $dir
        # Not (W): generic write includes SYNCHRONIZE/READ_CONTROL, which
        # would also block running the executables.
        icacls $dir /deny "*S-1-1-0:(OI)(CI)(WD,AD,WEA,WA)" | Out-Null
        ./target/release/azookey-smoke.exe --start $dir
        if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }

    - name: Build the TSF test host
      run: |
        cargo build --locked --release -p tsf-test
        cargo build --locked --release -p tsf-test --target i686-pc-windows-msvc

    - name: Type through TSF with the built IME
      shell: pwsh
      timeout-minutes: 10
      run: |
        # A crash must fail the step at once, not wait on an error dialog.
        $wer = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting"
        New-Item -Force $wer | Out-Null
        Set-ItemProperty $wer DontShowUI 1
        # The smoke test left the converter server and the candidate window
        # of this copy of the build running in this session.
        $dir = "C:\AzookeySmoke"
        # Registered the way the installer does: each DLL by the regsvr32 of
        # its own bitness.
        $runs = @(
          @{ regsvr32 = "$env:SystemRoot\System32\regsvr32.exe"; dll = "$dir\azookey_windows.dll"; host = "target\release\azookey-tsf-test.exe" },
          @{ regsvr32 = "$env:SystemRoot\SysWOW64\regsvr32.exe"; dll = "$dir\x86\azookey_windows.dll"; host = "target\i686-pc-windows-msvc\release\azookey-tsf-test.exe" }
        )
        foreach ($run in $runs) {
          $p = Start-Process $run.regsvr32 -ArgumentList "/s", "`"$($run.dll)`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "registering $($run.dll) failed with $($p.ExitCode)" }
          & $run.host --expect-dll $run.dll
          if ($LASTEXITCODE -ne 0) { throw "TSF test with $($run.dll) failed (exit $LASTEXITCODE)" }
        }

    - name: Upload Setup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: azookey-setup
        path: build/azookey-setup.exe
        if-no-files-found: error

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: Coverage of the unit tests and the TSF test
      shell: pwsh
      timeout-minutes: 45
      run: |
        rustup component add llvm-tools-preview
        # Its own target directory: the instrumented build must not mix
        # with the release binaries, which have no coverage data.
        $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "coverage-target"
        cargo llvm-cov show-env --pwsh | Out-String | Invoke-Expression
        cargo llvm-cov clean --workspace
        New-Item -ItemType Directory -Force coverage | Out-Null
        try {
          foreach ($tests in @(@("-p", "shared"), @("-p", "azookey-server", "--lib"), @("-p", "ui"), @("-p", "azookey-windows", "--lib"), @("-p", "launcher"))) {
            cargo test --locked @tests
            if ($LASTEXITCODE -ne 0) { throw "cargo test $tests failed" }
          }
          # The text service paths only run inside an application: the TSF
          # test drives an instrumented debug build of the IME DLL.
          cargo build --locked -p azookey-windows -p tsf-test
          if ($LASTEXITCODE -ne 0) { throw "instrumented build failed" }
          $dll = Join-Path $env:CARGO_TARGET_DIR "debug\azookey_windows.dll"
          $p = Start-Process regsvr32.exe -ArgumentList "/s", "`"$dll`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "registering $dll failed with $($p.ExitCode)" }
          & (Join-Path $env:CARGO_TARGET_DIR "debug\azookey-tsf-test.exe") --expect-dll $dll
          $tsf = $LASTEXITCODE

          $ignore = 'crates[\\/](smoke|tsf-test)[\\/]'
          cargo llvm-cov report --ignore-filename-regex $ignore --summary-only | Tee-Object coverage/summary.txt
          cargo llvm-cov report --ignore-filename-regex $ignore --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --ignore-filename-regex $ignore --html --output-dir coverage
          "## Coverage (unit tests and the TSF test)`n" + '```' + "`n" + (Get-Content coverage/summary.txt -Raw) + '```' >> $env:GITHUB_STEP_SUMMARY
          if ($tsf -ne 0) { throw "TSF test with the instrumented debug DLL failed (exit $tsf)" }
        } finally {
          # debug builds of the IME trace here
          Copy-Item -Recurse -ErrorAction SilentlyContinue "$env:LOCALAPPDATA\Azookey\logs" coverage/ime-logs
        }

    - name: Upload coverage
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage
        if-no-files-found: ignore
