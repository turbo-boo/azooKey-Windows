[package]
name = "smoke"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "azookey-smoke"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
shared = { path = "../shared" }
tonic = "0.12.3"
tokio = { version = "1.42.0", features = ["rt", "macros", "time", "net", "process"] }
tower = "0.5.1"
hyper-util = { version = "0.1.9", features = ["tokio"] }

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]
