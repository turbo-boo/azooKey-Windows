[package]
name = "tsf-test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "azookey-tsf-test"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"

[dependencies.windows]
version = "0.58.0"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "0.58.0"
